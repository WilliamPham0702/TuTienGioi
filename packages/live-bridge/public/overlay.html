<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Tu Tiên Giới — màn hình tạm</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  /* MÀN HÌNH TẠM: chỉ để kiểm tra cầu nối dữ liệu. Art thử: nền quảng trường + nhân vật ghép thô (chưa duyệt). */
  :root {
    --bg: rgba(10, 14, 28, 0.0);
    --panel: rgba(14, 20, 38, 0.82);
    --line: rgba(214, 190, 120, 0.55);
    --gold: #e9c46a;
    --jade: #63d2a1;
    --red: #ef6f6c;
    --blue: #6fa8ef;
    --text: #f4efe2;
    --muted: #b9b2a0;
  }
  html, body { margin: 0; background: var(--bg); overflow: hidden; }
  body { font-family: "Segoe UI", "Noto Sans", Arial, sans-serif; color: var(--text); }
  #stage {
    position: absolute; left: 0; top: 0; width: 1080px; height: 1920px;
    transform-origin: 0 0;
  }
  .panel { background: var(--panel); border: 2px solid var(--line); border-radius: 18px; }
  /* Vùng an toàn LIVE (VISUAL_SPEC): tránh 320 px dưới cùng và 140 px bên phải */
  #safe { position: absolute; z-index: 2; left: 24px; top: 24px; width: calc(1080px - 140px - 24px); height: calc(1920px - 320px - 24px); }

  #tide { position: absolute; left: 0; top: 0; right: 0; height: 74px; padding: 10px 18px; box-sizing: border-box; }
  #tide .label { font-size: 26px; font-weight: 700; color: var(--jade); }
  #tide .bar { margin-top: 8px; height: 14px; border-radius: 7px; background: rgba(255,255,255,.12); overflow: hidden; }
  #tide .fill { height: 100%; width: 0; background: linear-gradient(90deg, #3fb68b, #9ff0cf); transition: width .3s; }
  #tide.active .label { color: var(--gold); }
  #tide.active .fill { background: linear-gradient(90deg, #e9c46a, #fff2c2); }

  #seats { position: absolute; left: 0; right: 0; top: 92px; display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
  .seat { padding: 8px 14px; font-size: 22px; border-radius: 12px; min-width: 180px; text-align: center; }
  .seat b { display: block; font-size: 18px; color: var(--gold); font-weight: 600; }
  .seat.npc { opacity: .65; }

  #board { position: absolute; left: 0; top: 230px; width: 360px; padding: 14px 18px; box-sizing: border-box; }
  #board h3 { margin: 0 0 8px; font-size: 26px; color: var(--gold); }
  #board ol { margin: 0; padding-left: 30px; font-size: 22px; line-height: 1.5; }
  #board li span { color: var(--muted); float: right; }

  #plaza { position: absolute; left: 380px; right: 0; top: 230px; bottom: 200px; display: flex; flex-wrap: wrap; align-content: flex-start; gap: 10px; }
  .p { width: 132px; text-align: center; font-size: 16px; }
  .p .dot { width: 64px; height: 64px; margin: 0 auto 4px; border-radius: 50%; border: 3px solid rgba(255,255,255,.6); }
  .p .n { font-weight: 700; font-size: 17px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-shadow: 0 2px 3px #000; }
  .p .r { color: var(--muted); font-size: 14px; text-shadow: 0 1px 2px #000; }
  .p .s { color: var(--gold); font-size: 14px; }
  .p .pb { height: 6px; background: rgba(255,255,255,.18); border-radius: 3px; overflow: hidden; margin: 3px 10px 0; }
  .p .pb i { display: block; height: 100%; background: var(--jade); }
  .p.xinma .dot { border-color: var(--red); box-shadow: 0 0 14px var(--red); }
  .p.boost .dot { box-shadow: 0 0 14px var(--gold); }

  #challenge { position: absolute; left: 40px; right: 40px; top: 760px; padding: 20px 26px; display: none; }
  #challenge.on { display: block; }
  #challenge .title { font-size: 34px; font-weight: 800; text-align: center; color: var(--gold); }
  #challenge .row { display: flex; justify-content: space-between; font-size: 28px; margin-top: 12px; }
  #challenge .bar { display: flex; height: 26px; border-radius: 13px; overflow: hidden; margin-top: 10px; background: #222; }
  #challenge .a { background: var(--blue); } #challenge .b { background: var(--red); }
  #challenge .hint { text-align: center; font-size: 24px; color: var(--muted); margin-top: 10px; }

  #ann { position: absolute; left: 0; right: 0; bottom: 0; height: 180px; padding: 12px 18px; box-sizing: border-box; overflow: hidden; }
  #ann div { font-size: 26px; line-height: 1.4; animation: fade 9s forwards; }
  #ann div.high { color: var(--gold); font-weight: 800; font-size: 30px; }
  @keyframes fade { 0%{opacity:0} 5%{opacity:1} 85%{opacity:1} 100%{opacity:.35} }

  #paused { position: absolute; left: 0; right: 0; top: 640px; text-align: center; font-size: 60px; font-weight: 900; color: var(--gold); display: none; text-shadow: 0 4px 10px #000; }
  #conn { position: absolute; right: 8px; top: 4px; font-size: 14px; color: var(--red); }
  #tag { position: absolute; left: 24px; top: calc(1920px - 320px + 8px); font-size: 16px; color: rgba(255,255,255,.35); }
</style>
</head>
<body>
<div id="stage">
  <img id="bg" src="art/plaza_bg.png" alt="" style="position:absolute;left:0;top:0;width:1080px;height:1920px;z-index:0;">
  <img id="hero" src="art/disciple_preview.png" alt="" style="position:absolute;left:240px;top:1000px;width:600px;z-index:1;pointer-events:none;">
  <div id="safe">
    <div id="tide" class="panel"><div class="label">Linh Khí Triều</div><div class="bar"><div class="fill"></div></div></div>
    <div id="seats"></div>
    <div id="board" class="panel"><h3></h3><ol></ol></div>
    <div id="plaza"></div>
    <div id="challenge" class="panel">
      <div class="title">KHIÊU CHIẾN</div>
      <div class="row"><span id="ca"></span><span id="cdown"></span><span id="cb"></span></div>
      <div class="bar"><div class="a"></div><div class="b"></div></div>
      <div class="hint">Gõ <b>!ung A</b> hoặc <b>!ung B</b> rồi tặng quà để trợ chiến</div>
    </div>
    <div id="paused">TẠM DỪNG</div>
    <div id="ann" class="panel"></div>
  </div>
  <div id="conn"></div>
  <div id="tag">Màn hình tạm (chưa có art) · dữ liệu thật từ lõi game</div>
</div>
<script>
(() => {
  const $ = (s) => document.querySelector(s);
  const COLORS = ['#e76f51', '#2a9d8f', '#e9c46a', '#8ab17d', '#9b5de5', '#f15bb5'];
  const TABS = [['tuVi', 'Thiên Bảng · Tu Vi'], ['chienLuc', 'Thiên Bảng · Chiến Lực'], ['beQuan', 'Thiên Bảng · Bế Quan'], ['cungPhung', 'Thiên Bảng · Cúng Phụng']];
  let tab = 0, last = null, skew = 0;

  function fit() {
    const s = Math.min(innerWidth / 1080, innerHeight / 1920);
    $('#stage').style.transform = `scale(${s})`;
  }
  addEventListener('resize', fit); fit();

  const esc = (t) => String(t).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const fmt = (n) => n >= 1e6 ? (n / 1e6).toFixed(1) + 'tr' : n >= 1e3 ? (n / 1e3).toFixed(1) + 'k' : String(n);

  function renderBoard() {
    if (!last) return;
    const [k, title] = TABS[tab];
    $('#board h3').textContent = title;
    const rows = last.boards[k] || [];
    $('#board ol').innerHTML = rows.length ? rows.map((r) => `<li>${esc(r.name)} <span>${fmt(r.value)}</span></li>`).join('') : '<li style="list-style:none;color:#b9b2a0">Chưa có ai</li>';
  }
  setInterval(() => { tab = (tab + 1) % TABS.length; renderBoard(); }, 8000);

  function render(s) {
    last = s; skew = s.now - Date.now();
    const t = s.tide, active = t.activeUntil > s.now;
    $('#tide').classList.toggle('active', active);
    $('#tide .label').textContent = active ? `LINH KHÍ TRIỀU · Tu Vi x2 · còn ${Math.ceil((t.activeUntil - s.now) / 1000)}s` : `Linh Khí Triều ${t.progress}/${t.threshold} tim`;
    $('#tide .fill').style.width = (active ? 100 : Math.min(100, (t.progress / t.threshold) * 100)) + '%';

    $('#seats').innerHTML = s.seats.map((x) => `<div class="seat panel ${x.holder ? '' : 'npc'}"><b>${esc(x.role)}</b>${esc(x.holder ?? 'NPC')}</div>`).join('');

    $('#plaza').innerHTML = s.players.map((p) => `
      <div class="p ${p.xinMa ? 'xinma' : ''} ${p.boosted ? 'boost' : ''}">
        <div class="dot" style="background:${COLORS[p.appearance.color % COLORS.length]}"></div>
        <div class="n">${esc(p.name)}</div>
        <div class="s">${esc(p.seat ?? (p.badges[p.badges.length - 1] ?? ''))}</div>
        <div class="r">${esc(p.realm)} ${esc(p.minor)}</div>
        <div class="pb"><i style="width:${Math.round(p.progress * 100)}%"></i></div>
      </div>`).join('');

    const c = s.challenge;
    $('#challenge').classList.toggle('on', !!c);
    if (c) {
      const a = c.powerA + c.assistA, b = c.powerB + c.assistB, tot = Math.max(1, a + b);
      $('#ca').textContent = `A · ${c.challenger} (${fmt(a)})`;
      $('#cb').textContent = `(${fmt(b)}) ${c.defender} · B`;
      $('#challenge .a').style.width = (a / tot) * 100 + '%';
      $('#challenge .b').style.width = (b / tot) * 100 + '%';
    }
    $('#paused').style.display = s.paused ? 'block' : 'none';
    renderBoard();
  }

  setInterval(() => {
    if (!last || !last.challenge) return;
    const left = Math.max(0, Math.ceil((last.challenge.endsAt - (Date.now() + skew)) / 1000));
    $('#cdown').textContent = left > 0 ? `${left}s` : 'Chốt...';
  }, 200);

  function announce(items) {
    const box = $('#ann');
    for (const a of items) {
      const d = document.createElement('div');
      d.className = a.priority;
      d.textContent = a.text;
      box.appendChild(d);
    }
    while (box.children.length > 4) box.removeChild(box.firstChild);
  }

  function connect() {
    const ws = new WebSocket(`ws://${location.host}/ws`);
    ws.onopen = () => { $('#conn').textContent = ''; };
    ws.onmessage = (ev) => {
      const m = JSON.parse(ev.data);
      if (m.type === 'state') render(m.state);
      else if (m.type === 'announce') announce(m.items);
    };
    ws.onclose = () => { $('#conn').textContent = 'Mất kết nối lõi game, đang nối lại...'; setTimeout(connect, 2000); };
  }
  connect();
})();
</script>
</body>
</html>
