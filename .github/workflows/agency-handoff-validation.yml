name: AI Agency handoff validation

on:
  pull_request:
    paths:
      - "00_PROJECT/AGENCY/**"
      - "scripts/agency/**"
      - "ASSETS/shared/**"
      - ".github/workflows/agency-handoff-validation.yml"
  push:
    branches: [main]
    paths:
      - "00_PROJECT/AGENCY/**"
      - "scripts/agency/**"
      - "ASSETS/shared/**"
      - ".github/workflows/agency-handoff-validation.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run validator unit tests
        run: python -m unittest discover -s scripts/agency -p "test_*.py" -v
      - name: Validate committed manifests and handoffs
        run: python scripts/agency/validate_handoffs.py --root .
