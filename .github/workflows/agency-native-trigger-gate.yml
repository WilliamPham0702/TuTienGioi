name: AI Agency native trigger gate
on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: Task issue number
        required: true
        type: number
      worker_id:
        description: Registered worker id
        required: true
        type: choice
        options: [copilot, claude, deepseek]
permissions:
  contents: read
jobs:
  gated-request:
    if: vars.AGENCY_CI_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Create trigger gate manifest
        run: python scripts/agency/trigger_gate.py --issue "${{ inputs.issue_number }}" --worker "${{ inputs.worker_id }}" --output trigger-manifest.json
      - uses: actions/upload-artifact@v4
        with:
          name: native-trigger-gate-${{ inputs.issue_number }}
          path: trigger-manifest.json
          if-no-files-found: error
          retention-days: 7
      - name: Execution limitation
        run: echo "Manifest created; no AI provider session invoked."
  disabled:
    if: vars.AGENCY_CI_ENABLED != 'true'
    runs-on: ubuntu-latest
    steps:
      - run: echo "Gate opt-in is disabled; no request processed."
