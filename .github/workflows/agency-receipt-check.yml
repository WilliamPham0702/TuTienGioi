name: AI Agency receipt check
on:
  workflow_dispatch:
    inputs:
      receipt_path:
        description: Repository path to a committed receipt JSON file
        required: true
        type: string
      current_status:
        description: Optional previous task status to validate transition from
        required: false
        type: string
permissions:
  contents: read
jobs:
  validate:
    if: vars.AGENCY_CI_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Validate receipt
        shell: bash
        run: |
          set -euo pipefail
          python scripts/agency/receipt_protocol.py "${{ inputs.receipt_path }}" ${{ inputs.current_status && format('--current-status {0}', inputs.current_status) || '' }
  disabled:
    if: vars.AGENCY_CI_ENABLED != 'true'
    runs-on: ubuntu-latest
    steps:
      - run: echo "Receipt workflow opt-in disabled; no validation was performed."
